name: Construire l'APK Tirely

# Se declenche a chaque modification poussee sur main, ou a la main
# depuis l'onglet Actions (bouton "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

# Necessaire pour que le job puisse creer la Release qui contient l'APK.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      # Capacitor 8 exige Node 22 minimum.
      - name: Installer Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Capacitor 8 compile en Java 21 (sourceCompatibility VERSION_21).
      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preparer le SDK Android
        uses: android-actions/setup-android@v3

      # Capacitor 8 cible compileSdk 36 : on l'installe explicitement plutot
      # que d'esperer qu'il soit deja present sur la machine.
      - name: Installer la plateforme Android 36
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dependances
        run: npm install

      # Le dossier android/ n'est pas versionne (il est dans .gitignore) :
      # il est regenere a chaque build, ce qui garde le depot propre.
      - name: Generer le projet Android
        run: npx cap add android

      - name: Generer les icones et le splash screen
        run: npx capacitor-assets generate --android

      - name: Copier les fichiers web dans le projet
        run: npx cap sync android

      - name: Compiler l'APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renommer l'APK
        run: |
          mkdir -p sortie
          cp android/app/build/outputs/apk/debug/app-debug.apk \
             "sortie/Tirely-v${{ github.run_number }}.apk"
          ls -lh sortie/

      # Copie n°1 : dans l'onglet Actions. Telechargement en .zip,
      # demande d'etre connecte a GitHub.
      - name: Publier en artefact
        uses: actions/upload-artifact@v4
        with:
          name: Tirely-APK
          path: sortie/*.apk
          retention-days: 90

      # Copie n°2 : dans une Release. C'est CELLE-CI qu'il faut utiliser depuis
      # le telephone : lien direct vers le .apk, sans connexion ni decompression.
      - name: Publier la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" sortie/*.apk \
            --title "Tirely v${{ github.run_number }}" \
            --notes "APK de debug, installable directement. Build ${{ github.run_number }}."
